[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ir"
version = "0.2.0"
description = "Evidence-first DFIR investigation platform"
requires-python = ">=3.10"
dependencies = [
    "volatility3>=2.28.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]
