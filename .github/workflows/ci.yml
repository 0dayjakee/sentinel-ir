name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check sentinel tests
      - name: Type check
        run: mypy sentinel
      - name: Tests
        run: pytest
      - name: Security scan
        run: |
          bandit -q -r sentinel -ll -ii --skip B404,B603
          pip-audit || true
